<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overlapping text</title>
<link rel="stylesheet" href="slide.css">
</head>
<body>
<div data-pcv-slide>
  <h1 data-pcv-title>Two overlapping text blocks</h1>
  <!-- Defect: two unrelated blocks drawn on top of each other. -->
  <p style="position:absolute; left:120px; top:400px; margin:0; font-size:40px; white-space:nowrap;">The first block of words sits here</p>
  <p style="position:absolute; left:160px; top:412px; margin:0; font-size:40px; white-space:nowrap;">A second block lands on top of it</p>
</div>
</body>
</html>
