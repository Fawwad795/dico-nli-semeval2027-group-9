[project]
name = "dico-nli"
version = "0.1.0"
description = "SemEval-2027 Task 2 (DiCo-NLI): directional-consistent fine-grained NLI. Semester research project for the Large Language Models course."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "en-core-web-sm",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "sentencepiece>=0.2.2",
    "spacy>=3.8.16",
    "textstat>=0.7.13",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "modal>=1.6.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
]

# torch: CPU wheels on Windows and Linux so a teammate's `uv sync` stays small; macOS uses
# the PyPI wheel (the CPU index has none). GPU runs build their own CUDA image on Modal.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
